<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Catalog - tks Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toast-enter { transform: translateX(100%); opacity: 0; }
        .toast-show { transform: translateX(0); opacity: 1; transition: all 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased p-6" data-page="store">

    <div id="header-slot"></div>

    <main class="space-y-6 max-w-7xl mx-auto">
        <!-- Store Feature Only -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div id="product-catalog-feature" class="lg:col-span-2 space-y-3">
                <button id="btn-add-dynamic-product" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded">Add Random Item</button>
                <div id="product-list-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            </div>

            <div id="shopping-cart-feature" class="bg-white p-4 rounded-xl border">
                <h3 class="font-bold text-sm border-b pb-2 mb-3">Cart</h3>
                <div id="cart-items-container"></div>
                <div class="mt-4 pt-2 border-t text-xs flex justify-between font-bold">
                    <span>Total Items: <span id="cart-total-qty">0</span></span>
                    <span id="cart-total-price" class="text-indigo-600">$0.00</span>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-slot"></div>
    <div id="global-toast-slot" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>
    <div id="global-modal-slot"></div>

    <script type="module" src="./store.js"></script>
</body>
</html>
