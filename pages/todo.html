<main class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-900">Task Management</h2>
        <span id="todo-stats" class="text-xs font-semibold bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full">
            0 Tasks Remaining
        </span>
    </div>

    <!-- Add Todo Form -->
    <form id="todo-form" class="flex gap-2 bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
        <input 
            type="text" 
            id="todo-input" 
            placeholder="Write a new task..." 
            class="flex-1 px-4 py-2 text-sm border-none outline-none bg-transparent"
        >
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors">
            Add Task
        </button>
    </form>

    <!-- Todo Items Container -->
    <div id="todo-list-container" class="space-y-2 min-h-[150px]">
        <!-- Dynamic Render -->
    </div>
</main>
